---
- name: Ensure apt repository list file {{ apt_repository_name }}
  ansible.builtin.template:
    src: sources.list.j2
    dest: "{{ apt_repositories_sources_list_dot_d_configuration_directory }}/{{ apt_repository_file }}.list"
    group: root
    owner: root
    mode: "0644"
  when:
    - apt_repository_state == "present"
    - apt_repository_format == "legacy"
  notify: Ensure apt cache
  become: true

- name: Ensure apt repository list file is absent {{ apt_repository_name }}
  ansible.builtin.file:
    path: "{{ apt_repositories_sources_list_dot_d_configuration_directory }}/{{ apt_repository_file }}.list"
    state: absent
  when: apt_repository_state == "absent" or apt_repository_format != "legacy"
  notify: Ensure apt cache
  become: true

- name: Ensure apt repository sources file {{ apt_repository_name }}
  ansible.builtin.template:
    src: sources.j2
    dest: "{{ apt_repositories_sources_list_dot_d_configuration_directory }}/{{ apt_repository_file }}.sources"
    group: root
    owner: root
    mode: "0644"
  when:
    - apt_repository_state == "present"
    - apt_repository_format == "deb822"
  notify: Ensure apt cache
  become: true

- name: Ensure apt repository sources file is absent {{ apt_repository_name }}
  ansible.builtin.file:
    path: "{{ apt_repositories_sources_list_dot_d_configuration_directory }}/{{ apt_repository_file }}.sources"
    state: absent
  when: apt_repository_state == "absent" or apt_repository_format != "deb822"
  notify: Ensure apt cache
  become: true

- name: Ensure apt cache is up to date
  ansible.builtin.meta: flush_handlers
